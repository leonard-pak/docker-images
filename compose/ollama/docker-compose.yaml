services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: [ "11434:11434" ]
    volumes:
      - ollama:/root/.ollama
    pull_policy: always
    tty: true
    restart: no # unless-stopped 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports: [ "127.0.0.1:3000:8080" ]
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
      - WEBUI_NAME=Chat AI
      - NO_PROXY=localhost,127.0.0.1,ollama
      - WEBUI_SECRET_KEY=t0p-s3cr3t
    pull_policy: always
    restart: no # unless-stopped

volumes:
  ollama:
  open-webui:
